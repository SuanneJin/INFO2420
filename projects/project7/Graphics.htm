<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>Rent a Pet - Graphics</title>

	<style type="text/css">
		body {
			background-color: #FFF3E6;
			background-image: url('Images/2colback.jpg');
			background-repeat: repeat-y;
		}

		#thumbs,
		#image {
			width: 800px;
			text-align: center;
			margin: 0 auto 0 auto;
			color: #000;
		}

		#thumbs {
			margin-top: 10px;
		}

		#thumbs img {
			border: solid 6px #AA7539;
			margin: 5px;
			width: 150px;
			height: 100px;
			vertical-align: top;
		}

		#image {
			height: 430px;
			margin-top: 8px;
		}

		.instructions {
			font-style: italic;
		}

		#logo {
			margin-top: 20px;
		}

		#bottomText {
			margin-top: 16px;
			font-size: 22px;
		}

		#page {
			text-align: center;
			padding-top: 10px;
		}
	</style>

	<script language="JavaScript" type="text/javascript">

		PrintButton1 = new Image
		PrintButton2 = new Image
		logo1 = new Image
		logo2 = new Image
		if (document.images) {
			PrintButton1.src = "Images/Print1.jpg"
			PrintButton2.src = "Images/Print2.jpg"
			logo1.src = "Images/Logo1.jpg"
			logo2.src = "Images/logo2.jpg"
		}


		var imgArray = new Array(
			'BirdDogLg.jpg',
			'HuntingDogsLg.jpg',
			'KidsDogLg.jpg',
			'CatandDogLg.jpg'
		);

		var titleArray = new Array(
			'Bird and Dog',
			'Two Hunting Dogs',
			'Dog and Kids',
			'Cat and Dog'
		);

		var imgPath = "Images/fullsize/";

		function swapImage(imgID) {

			var theImage = document.getElementById('theImage');
			var textDiv = document.getElementById('bottomText');

			var newImg;
			var textTitle;

			newImg = imgArray[imgID];
			theImage.src = imgPath + newImg;

			textTitle = titleArray[imgID];

			textDiv.innerHTML = textTitle;
		}

		function preloadImages() {
			for (var i = 0; i < imgArray.length; i++) {
				var tmpImg = new Image;
				tmpImg.src = imgPath + imgArray[i];
			}
		}


	</script>


</head>

<body onload="preloadImages()">

	<div id="page">

		<div>
			<a href="" onmouseover="document.getElementById('print').src='Images/Print2.jpg';"
				onmouseout="document.getElementById('print').src='Images/Print1.jpg';">

				<img src="Images/Print1.jpg" width="200" height="50" id="print" alt="Print Page" />

			</a>
		</div>


		<div id="logo">
			<a href="" onmouseover="document.getElementById('logoimage').src='Images/logo2.jpg';"
				onmouseout="document.getElementById('logoimage').src='Images/Logo1.jpg';">

				<img src="Images/Logo1.jpg" width="133" height="126" id="logoimage" alt="logo" style="border:none;" />

			</a>
		</div>

		<br />
		<br />
		<br />
		<br />

		<div id="thumbs">
			<img src="Images/thumbnails/BirdDogSmall.jpg" alt="Bird and Dog" onmouseover="swapImage(0);" />
			<img src="Images/thumbnails/HuntingDogsSm.jpg" alt="Two hunting Dogs" onmouseover="swapImage(1);" />
			<img src="Images/thumbnails/KidsDogSmall.jpg" alt="Dog and two kids" onmouseover="swapImage(2);" />
			<img src="Images/thumbnails/CatandDogSm.jpg" alt="Cat and Dog" onmouseover="swapImage(3);" />

		</div>

		<div id="image">

			<img id="theImage" src="Images/fullsize/BirdDogLg.jpg" alt="Bird and Dog" />
			<h3 id="bottomText">Bird and Dog</h3>
		</div>
		<p>
			<a href="http://validator.w3.org/check?uri=referer"><img src="http://www.w3.org/Icons/valid-xhtml10"
					alt="Valid XHTML 1.0 Transitional" height="31" width="88" aligh="left" /></a>
		</p>
	</div>

</body>

</html>
